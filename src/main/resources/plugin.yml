name: INCUIDChat
version: 1.4.0-phase5
main: com.incuid.chat.IncuidChatPlugin
api-version: '26.3'
author: INCUID
description: Immersive, lightweight INCUID survival chat
softdepend: [LuckPerms, PlaceholderAPI]
permissions:
  incuidchat.admin:
    default: op
  incuidchat.reload:
    default: op
  incuidchat.health:
    default: true
  incuidchat.health.hide:
    default: true
  incuidchat.health.style:
    default: true
  incuidchat.mentions:
    default: true
  incuidchat.mentions.everyone:
    default: op
  incuidchat.chat.color:
    default: op
  incuidchat.items:
    default: true
  incuidchat.coordinates:
    default: true
  incuidchat.pm:
    default: true
  incuidchat.pm.bypass:
    default: op
  incuidchat.afk:
    default: true
  incuidchat.moderation.bypass:
    default: op
  incuidchat.moderation.mute:
    default: op
  incuidchat.moderation.unmute:
    default: op
  incuidchat.moderation.clear:
    default: op
  incuidchat.moderation.notify:
    default: op

  incuidchat.staffchat:
    default: op
  incuidchat.channels.local:
    default: true
  incuidchat.channels.global:
    default: true
