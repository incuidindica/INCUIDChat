# INCUID Chat — Phase 4. Changes apply with /ic reload.
health:
  enabled: true
  segments: 10 # Version 1 supports 10 segments only.
  filled-symbol: '|'
  empty-symbol: '.'
  show-brackets: true
  hearts: false # true uses ❤ and ♡ for the BARS style (ten positions)
  # Each viewer chooses their own chat display using /ic healthstyle bars or heart.
  # /ic healthbar controls whether YOU see health indicators for anyone in chat.
  thresholds:
    healthy: 75.0
    injured: 50.0
  colors:
    healthy: '#55FF55'
    injured: '#FFDD55'
    critical: '#FF5555'
    dead: '#555555'
    empty: '#555555'
  hover:
    enabled: true
  visibility:
    allow-player-toggle: true
    default-visible: true
chat:
  enabled: true
  separator: ' » '
  player-color: '#FFFFFF'
  message-color: '#B8C5D1' # Soft blue-gray: readable without a wall of white text
  name-hover: true
  name-click-suggest-msg: true
  allow-permission-colors: false # Reserved for a later release
mentions:
  enabled: true
  highlight-color: '#FFAA00'
  sound: 'BLOCK_NOTE_BLOCK_PLING'
  cooldown-seconds: 10
  everyone-enabled: true
  everyone-cooldown-seconds: 60
  sound-volume: 0.6
  sound-pitch: 1.25
integrations:
  luckperms-prefix: true
  luckperms-suffix: true
experimental:
  enabled: false

# Phase 2: Chat tokens. Disabled tags remain literal text.
interactive:
  items:
    enabled: true
    max-tags: 1 # maximum replacements per message (0..3)
    max-hover-bytes: 8192 # skip oversized custom item metadata
  coordinates:
    enabled: true
    max-tags: 1

# Private messages use /incuidmsg etc. to avoid collisions with EssentialsX.
# Set register-short-aliases to true only if no other plugin owns /msg and /reply.
private-messages:
  enabled: true
  register-short-aliases: false
  sound:
    enabled: false

# Phase 3: immersive community announcements (each module optional).
announcements:
  join:
    enabled: true
    format: '<gray>✦ <white>{player}</white> joined the world.</gray>'
  leave:
    enabled: true
    format: '<gray>✦ <white>{player}</white> left the world.</gray>'
  first-join:
    enabled: true
    public-format: '<gold>✦ Welcome to INCUID, {player}!</gold>'
    private-welcome: true
    private-format: '<gray>Welcome to INCUID! Visit <aqua>playincuid.com</aqua></gray>'
  death:
    enabled: true
    prefix: '<red>☠ </red>'
    private-coordinates: true
  advancement:
    enabled: true
    prefix: '<gold>✦ </gold>'

# AFK status is per player. Both manual and automatic AFK clear on movement/activity by default.
# [AFK] brackets are white (#FFFFFF); AFK letters are red (#FF5555).
afk:
  enabled: true
  clear-on-chat: true
  broadcast: false
  manual:
    clear-on-activity: true
  auto:
    enabled: true
    idle-seconds: 300
    clear-on-activity: true

# Phase 4 — configurable, lightweight moderation. All options can be reloaded.
# Mutes persist to mutes.yml; moderation actions are appended to moderation.log.
moderation:
  enabled: true
  spam:
    max-length: 512
    cooldown:
      enabled: true
      milliseconds: 1100
    duplicate:
      enabled: true
      window-seconds: 15
    repeated-characters:
      enabled: true
      limit: 12
    flood:
      enabled: true
      window-seconds: 10
      max-messages: 6
  filter:
    enabled: false # Opt in before adding blocked words to filters.yml
    action: cancel # cancel, replace, notify
    replacement: '***'
    notify-staff: true
  mutes:
    enabled: true
  clear:
    enabled: true

# Phase 5: default disabled for backwards-compatible public chat.
channels:
  enabled: false # Master switch: set true to register /chat, /g, /l and /sc
  register-shortcuts: true # Registered at server startup; restart after changing this.
  show-labels: true
  local:
    enabled: true # Available to all players when channels.enabled is true
    radius: 100
  staff:
    enabled: true # Operators and users granted incuidchat.staffchat only
# Diagnostic count-only logging: never logs chat text or player UUIDs.
diagnostics:
  recipients:
    enabled: false
# Optional idle AFK detection (manual /afk works regardless).

