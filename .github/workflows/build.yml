name: Build and Verify INCUID Chat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Record tool versions
        run: |
          java -version
          gradle --version

      - name: Compile, test, and package
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ci-logs/gradle-build.log

      - name: Summarize test results
        if: always()
        shell: bash
        run: python3 .github/scripts/ci_test_summary.py

      - name: Upload test reports and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INCUIDChat-v1.4.0-build-reports
          path: |
            ci-logs/
            build/test-results/test/
            build/reports/tests/test/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compiled plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: INCUIDChat-v1.4.0-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
